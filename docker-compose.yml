# Fleet Commander — the managed stack.
#
# Brings up, on a single Docker host:
#   • fc          — the manager (this project): control loop + status UI + /metrics
#   • janus       — the connector version-updater (no lock; FC enrols connectors via labels)
#   • log-shipper — OPTIONAL stdout->SIEM shipper, behind the `shipping` profile
#
# FC self-provisions its Connectors — there are no seed Connector services. One FC
# instance manages exactly one Remote Network (Key Design Rule N1): it fills that
# RN's fleet up to `min_connectors` from empty and scales further on load, minting
# tokens via the Twingate API and injecting them straight into the containers it
# runs.
#
# Quick start:
#   cp .env.example .env                       # fill in TWINGATE_NETWORK + TWINGATE_API_KEY
#   cp config/config.example.yaml config/config.yaml   # set connector_image + remote_network_id
#   docker compose up -d                       # manager + janus; FC provisions the rest
#   docker compose --profile shipping up -d    # also start the log-shipper
#
# ─────────────────────────────────────────────────────────────────────────────
# SECURITY — why the manager mounts the Docker socket, and what it costs.
#
# FC's actuator drives the *local* Docker socket to run / stop / restart / remove
# Connector containers. Mounting /var/run/docker.sock therefore grants FC control
# of the Docker daemon, which is ROOT-EQUIVALENT on the host: anything that can
# talk to the socket can start a privileged container and own the box.
#
# Mitigations (see the "Docker socket is root-equivalent" note in README.md):
#   • Treat this host as a trusted control-plane node; don't co-locate untrusted workloads.
#   • Bind port 8080 to a trusted/loopback interface behind a TLS-terminating proxy;
#     never expose the status UI / override endpoints to the public internet.
#   • For hardened deployments, put a read-mostly Docker-socket PROXY in front of the
#     daemon and point DOCKER_HOST at it, allowlisting only the container-lifecycle
#     calls FC needs (see the commented `socket-proxy` service below).
#   • The config volume is mounted read-only so a compromised loop can't rewrite policy.
# ─────────────────────────────────────────────────────────────────────────────

services:
  fc:
    build: .
    image: fleet-commander:dev
    container_name: fc
    restart: unless-stopped
    env_file: .env
    volumes:
      # Root-equivalent: required so the actuator can run/stop/rm Connector containers.
      # Swap for `tcp://socket-proxy:2375` (see below) to harden.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/config.yaml:/app/config/config.yaml:ro   # read-only: policy can't be rewritten
      - fc_state:/app/state                               # cooldowns + action history (survives restart)
    ports:
      # Loopback-only by DEFAULT: the read-only status UI, /metrics, and the
      # (optional) override endpoints are not reachable off-box. Read it via an
      # SSH tunnel (`ssh -L 8080:localhost:8080 host`) or front it with a
      # TLS-terminating reverse proxy. Public exposure is opt-in (next line).
      - "127.0.0.1:8080:8080"   # status UI + /healthz /readyz /metrics
      # Public exposure — ONLY behind a TLS proxy, never plain HTTP on a public
      # interface (the override secret travels in a request header):
      # - "8080:8080"
    healthcheck:
      # python is already in the image (python:3.12-slim); no curl/wget needed.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── No seed Connectors ───────────────────────────────────────────────────────
  # FC self-provisions its fleet: for every configured Remote Network it brings
  # the Connector count up to `min_connectors` from empty (connectorCreate ->
  # connectorGenerateTokens -> docker run, with tokens injected straight into the
  # new container — never written to .env), then scales further on load. So no
  # pre-seeded Connector containers are needed; start the manager and it fills the
  # floor itself. The image FC provisions is `config.yaml -> connector_image`.

  # ── janus — connector version updater ────────────────────────────────────────
  # Separate service that upgrades Connector containers in place whenever a newer
  # image is published. janus has NO lock: FC enrols every connector it
  # provisions with janus's auto-update labels (config.yaml -> janus.enabled /
  # janus.interval_seconds → janus.autoupdate.enable + janus.autoupdate.interval)
  # and tolerates the brief container recreate an upgrade causes via the
  # startup-grace / unhealthy-threshold windows. Mounts the socket like FC does.
  janus:
    image: ghcr.io/twingate-solutions/janus-updater-service:latest
    container_name: fc-janus
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ── log-shipper (optional) ───────────────────────────────────────────────────
  # Ships Connector real-time analytics / stdout to an S3-compatible bucket.
  # Independent of FC — enable only if you want to push connector analytics to a
  # non-AWS S3 bucket (e.g. GCS via S3 interop), which Twingate doesn't do
  # natively. Start with:  docker compose --profile shipping up -d
  #
  # It reads container LOG FILES, not the Docker socket, so it mounts
  # /var/lib/docker/containers read-only (NOT the socket). Configure it via the
  # TWINGATE_SHIPPER_* block in .env (see .env.example → "log-shipper" section);
  # the container filter must match the connector image you provision.
  log-shipper:
    image: ghcr.io/twingate-solutions/twingate-log-shipper:1
    container_name: fc-log-shipper
    profiles: [ "shipping" ]
    restart: unless-stopped
    # Scoped env (NOT env_file: .env) so FC's TWINGATE_API_KEY is never handed to
    # the shipper. Values are substituted from .env at compose time.
    environment:
      TWINGATE_SHIPPER_S3_BUCKET: "${TWINGATE_SHIPPER_S3_BUCKET}"
      TWINGATE_SHIPPER_S3_ACCESS_KEY_ID: "${TWINGATE_SHIPPER_S3_ACCESS_KEY_ID}"
      TWINGATE_SHIPPER_S3_SECRET_ACCESS_KEY: "${TWINGATE_SHIPPER_S3_SECRET_ACCESS_KEY}"
      TWINGATE_SHIPPER_S3_ENDPOINT_URL: "${TWINGATE_SHIPPER_S3_ENDPOINT_URL:-}"
      TWINGATE_SHIPPER_S3_REGION: "${TWINGATE_SHIPPER_S3_REGION:-}"
      TWINGATE_SHIPPER_S3_PREFIX: "${TWINGATE_SHIPPER_S3_PREFIX:-}"
      TWINGATE_SHIPPER_DOCKER_CONTAINER_NAME_FILTER: "${TWINGATE_SHIPPER_DOCKER_CONTAINER_NAME_FILTER:-twingate-custom-connector-container}"
      # One shipper per host watches ALL matching connector containers (dynamic
      # discovery), not just one. By default it also ships the connector's stderr
      # (the custom image's `[metrics]` lines); set false for analytics-only.
      TWINGATE_SHIPPER_INCLUDE_STDERR: "${TWINGATE_SHIPPER_INCLUDE_STDERR:-true}"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

volumes:
  fc_state:
