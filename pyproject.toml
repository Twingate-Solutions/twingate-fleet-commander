[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-commander"
version = "0.1.0"
description = "Single-host containerized control plane that autoscales a fleet of Twingate Connectors."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Twingate Solutions" }]
keywords = ["twingate", "connector", "autoscaling", "docker", "ztna"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "aiodocker>=0.23",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Cloud backends are opt-in extras so the base install (and the local-Docker
# default) stays lean. Install with ``pip install -e '.[ecs]'`` etc. Identity is
# taken from each SDK's standard credential chain.
ecs = [
    "aioboto3>=13.0",
]
aci = [
    # The ACI actuator and Azure log collector talk to the Azure REST APIs over
    # the project's existing httpx client; azure-identity only supplies bearer
    # tokens from the managed-identity / service-principal credential chain.
    "azure-identity>=1.17",
]
cloud = [
    "fleet-commander[ecs,aci]",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "playwright>=1.40",
    "pytest-playwright>=0.5",
]

[project.scripts]
fc = "fc.main:run"
fc-teardown = "fc.main:teardown"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fc = ["web/templates/*", "web/static/*"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ASYNC",# flake8-async
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are expected in tests

[tool.ruff.lint.isort]
known-first-party = ["fc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["aiodocker.*", "respx.*"]
ignore_missing_imports = true

# Cloud SDKs are optional extras and may be absent from the dev environment;
# the actuators/collectors keep their imports lazy and inject clients, so these
# stubs are only needed by the platform factory.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "boto3.*", "botocore.*", "azure.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
