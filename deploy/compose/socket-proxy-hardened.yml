# Fleet Commander — HARDENED variant: FC behind a read-mostly Docker socket proxy.
#
# Mounting /var/run/docker.sock into FC is root-equivalent on the host. This
# variant keeps the raw socket OUT of the FC container: a tecnativa
# docker-socket-proxy sits in front of the daemon, FC talks to it over TCP via
# DOCKER_HOST, and the proxy allowlists ONLY the calls FC's actuator needs
# (list/inspect/create/start/stop/restart/remove + /version for the readyz probe).
# Everything else (images build, exec, swarm, secrets, networks, …) is denied.
#
# ⚠ IMPORTANT — what this proxy does and does NOT buy you:
#   It REDUCES the Docker API *surface* reachable from FC (no exec, no secrets
#   enumeration, no image pulls, no swarm). It does NOT make the proxy network a
#   safe boundary: CONTAINERS + POST authorizes `POST /containers/create` with an
#   attacker-controlled body, and the tecnativa proxy cannot inspect that body.
#   Anyone who can reach the proxy can therefore create a container with
#   `HostConfig.Binds: ["/:/host"]` / `Privileged: true` / `PidMode: host` and
#   own the host — i.e. container-create-with-binds is still root-equivalent.
#   Treat the proxy network as a trust boundary: ONLY FC may reach it, and the
#   host must still not co-locate untrusted workloads. Genuine isolation requires
#   a body-inspecting policy proxy or rootless/sysbox Docker (out of scope here).
#
# The root ../../docker-compose.yml documents the trust model; this is the
# hardened deployment topology. Only the proxy touches the socket.
#
# Run from the repo root:
#   docker compose -f deploy/compose/socket-proxy-hardened.yml up -d

services:
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: fc-socket-proxy
    restart: unless-stopped
    environment:
      # Default-deny; turn on only what FC needs.
      CONTAINERS: "1"   # /containers — list, inspect, create, remove
      POST: "1"         # allow POST — run / start / stop / restart / delete
      VERSION: "1"      # /version — used by FC's /readyz Docker probe
      # Explicitly keep the dangerous surfaces off:
      EXEC: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      INFO: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      SYSTEM: "0"
    volumes:
      # Only the proxy sees the raw socket; it is never mounted into FC.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No host ports: reachable only on the internal compose network.

  fc:
    build: ../..
    image: fleet-commander:dev
    container_name: fc
    restart: unless-stopped
    env_file: ../../.env
    # Point the actuator at the proxy instead of the raw socket. This overrides
    # DOCKER_HOST from .env.
    environment:
      DOCKER_HOST: "tcp://socket-proxy:2375"
    depends_on:
      - socket-proxy
    volumes:
      # NOTE: no docker.sock mount here — that is the whole point of this variant.
      - ../../config/config.yaml:/app/config/config.yaml:ro
      - fc_state:/app/state
    ports:
      - "127.0.0.1:8080:8080"   # loopback by default; public exposure only behind TLS
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  fc_state:
